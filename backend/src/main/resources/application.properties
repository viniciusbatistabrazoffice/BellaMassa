spring.application.name=backend
server.port=${PORT:4444}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bellamassa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT12H}
